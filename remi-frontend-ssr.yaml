---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: remi-frontend-ssr
  namespace: sit-website
spec:
  replicas: 1
  selector:
    matchLabels:
      app: remi-frontend-ssr
  template:
    metadata:
      labels:
        app: remi-frontend-ssr
    spec:
      containers:
        - name: remi-frontend-ssr
          image: {{FULL_IMAGE_NAME}}
          imagePullPolicy: Always
          ports:
            - containerPort: 3212
          # 运行时配置：镜像不带环境，变量由运维维护的 ConfigMap 在容器启动时注入。
          # 必需：WEBSITE_API_SERVER_URL / WEBSITE_API_VERSION
          # 环境开关：SITE_URL（对外 origin，影响 canonical/sitemap）、SITE_ENV（=production 才放开索引）
          # 可选：WEBSITE_API_RSA_PUBLIC_KEY（后端密钥对变更时同步）
          envFrom:
            - configMapRef:
                name: remi-frontend-ssr-configmap
      imagePullSecrets:
        - name: registry-secret
---
apiVersion: v1
kind: Service
metadata:
  name: remi-frontend-ssr-svc
  namespace: sit-website
spec:
  selector:
    app: remi-frontend-ssr
  ports:
    - port: 80
      targetPort: 3212
  type: ClusterIP
