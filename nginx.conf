# Remi SSR 官网（ssr.remitech.ai）— nginx 反向代理
#
# 将域名/端口代理到本地 Next.js standalone 服务（默认端口 3212）。
#
# 动态端口切换：通过 ?XTransformPort=<port> 可将请求转发到其他端口，
# 用于并行运行多个实例时快速切换（开发/调试场景）。
#
# 部署步骤：
#   1. 将本文件复制到 nginx 配置目录
#   2. 按需修改 server_name 和 proxy_pass 端口
#   3. nginx -t && nginx -s reload

server {
    listen 81;
    server_name _;

    # 动态端口切换（通过查询参数 XTransformPort）
    # 例：http://host:81/?XTransformPort=3213 → 转发到 localhost:3213
    set $backend_port 3212;

    if ($arg_XTransformPort ~ ^(\d+)$) {
        set $backend_port $1;
    }

    location / {
        client_max_body_size 20M;
        proxy_pass http://localhost:$backend_port;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;

        # SSE / 流式响应支持
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
    }
}
